[package]
name = "korgi-product-support-oss"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4.3"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "uuid", "chrono", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
tokio-util = "0.7.19"
envy = "0.4.2"
moka = { version = "0.12.15", features = ["sync"] }
