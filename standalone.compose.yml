services:
  ollama:
    image: ollama/ollama:latest
    container_name: support-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - app-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        pid=$!
        echo "⏳ Waiting for Ollama server to start..."
        sleep 5
        echo "🧠 Pulling chat model: ${LLM_MODEL:-qwen2.5:1.5b}..."
        ollama pull ${LLM_MODEL:-qwen2.5:1.5b}
        echo "🧬 Pulling embedding model: ${EMBEDDING_MODEL:-nomic-embed-text}..."
        ollama pull ${EMBEDDING_MODEL:-nomic-embed-text}
        echo "✅ All models ready!"
        wait $pid
    deploy:
      resources:
        limits:
          memory: 6G

  qdrant:
    image: qdrant/qdrant:latest
    container_name: support-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  app-network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
  qdrant_storage:
    driver: local